<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil interactif</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="carte">

        <h1 id="titre-principal">Mon profil</h1>

        <p class="sous-titre">Futur développeur web</p>

        <section>
            <h2>Présentation</h2>
            <p>
                Je suis titulaire d'une licence en mathématiques.
                J'apprends à créer des sites Internet.
            </p>
        </section>

        <section>
            <h2>Technologies que j'apprends</h2>
            <div class="conteneur">
                <div class="boite">HTML</div>
                <div class="boite">CSS</div>
                <div class="boite">JavaScript</div>
            </div>
        </section>

        <!-- On ajoute un id="btn-contact" et un id="message-confirmation" -->
        <button id="btn-contact">Me contacter</button>
        <p id="message-confirmation" style="margin-top: 15px; font-weight: bold; color: #27ae60;"></p>

    </main>

    <!-- On lie notre fichier JavaScript à la fin -->
    <script src="script.js"></script>

</body>

</html>
